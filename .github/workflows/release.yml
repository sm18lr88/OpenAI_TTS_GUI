name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false

      - name: Sync deps
        run: uv sync --extra dev --python 3.14

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run ty check

      - name: Tests and coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest --ignore=tests/perf --cov=openai_tts_gui --cov-branch --cov-report=term-missing --cov-report=json:coverage.json

      - name: Independent coverage thresholds
        run: uv run scripts/check_coverage_thresholds.py coverage.json --min-statements 90 --min-branches 90

      - name: Build exe
        run: uv run pyinstaller --noconfirm packaging/pyinstaller/openai_tts.spec

      - name: Smoke packaged exe
        shell: pwsh
        run: '& "dist\OpenAI-TTS\openai_tts_bin.exe" --self-check'

      - name: Build installer
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            choco install nsis --no-progress -y
          }
          & "C:\Program Files (x86)\NSIS\makensis.exe" packaging/windows/installer.nsi

      - name: Zip portable
        shell: pwsh
        run: Compress-Archive -Path dist\OpenAI-TTS\* -DestinationPath dist\OpenAI-TTS-portable.zip

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $required = @(
            "dist\OpenAI-TTS\openai_tts_bin.exe",
            "dist\OpenAI-TTS-Setup.exe",
            "dist\OpenAI-TTS-portable.zip"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing artifact: $path" }
            if ((Get-Item $path).Length -le 0) { throw "Empty artifact: $path" }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OpenAI-TTS-windows
          path: |
            dist/OpenAI-TTS-Setup.exe
            dist/OpenAI-TTS-portable.zip

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false

      - name: Sync deps
        run: uv sync --extra dev --python 3.14

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run ty check

      - name: Tests and coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest --ignore=tests/perf --cov=openai_tts_gui --cov-branch --cov-report=term-missing --cov-report=json:coverage.json

      - name: Independent coverage thresholds
        run: uv run scripts/check_coverage_thresholds.py coverage.json --min-statements 90 --min-branches 90

      - name: Build
        run: uv run pyinstaller --noconfirm packaging/pyinstaller/openai_tts.spec

      - name: Smoke packaged app
        run: ./dist/OpenAI-TTS/openai_tts_bin --self-check

      - name: Zip app
        run: cd dist && zip -r OpenAI-TTS-macos.zip OpenAI-TTS/

      - name: Verify macOS artifact
        run: test -s dist/OpenAI-TTS-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenAI-TTS-macos
          path: dist/OpenAI-TTS-macos.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" --name OpenAI-TTS-windows --dir artifacts
          gh run download "${{ github.run_id }}" --name OpenAI-TTS-macos --dir artifacts
          test -s artifacts/OpenAI-TTS-Setup.exe
          test -s artifacts/OpenAI-TTS-portable.zip
          test -s artifacts/OpenAI-TTS-macos.zip

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum OpenAI-TTS-Setup.exe OpenAI-TTS-portable.zip OpenAI-TTS-macos.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## OpenAI TTS ${{ github.ref_name }}

            A desktop GUI package and source-installable CLI that generate speech audio from text with OpenAI's TTS API.

            <img src="https://raw.githubusercontent.com/sm18lr88/OpenAI_TTS_GUI/${{ github.ref_name }}/docs/images/screenshot.png" alt="OpenAI TTS GUI screenshot" width="720">

            ### What's New
            - **TTS price estimates**: Live model-aware cost estimates in the text stats row
            - **Polished desktop UI**: A flatter dark theme and resizable controls
            - **More responsive startup**: Background ffmpeg and API key checks
            - **ffmpeg discovery**: Improved PATH handling for packaged and source runs
            - **Safer worker lifecycle**: Cleaner cancellation and shutdown behavior
            - **Windows installer**: One-click setup with Start Menu shortcuts
            - **Python 3.14** required

            ### Downloads
            | File | Description |
            |---|---|
            | `OpenAI-TTS-Setup.exe` | Windows installer (recommended) |
            | `OpenAI-TTS-portable.zip` | Portable Windows build. Extract and run. |
            | `OpenAI-TTS-macos.zip` | macOS build |

            ### Requirements
            - An [OpenAI API key](https://platform.openai.com/api-keys)
            - [FFmpeg](https://ffmpeg.org/download.html) installed and on PATH

            ### Integrity
            Verify downloads with `SHA256SUMS.txt`.

          files: |
            artifacts/OpenAI-TTS-Setup.exe
            artifacts/OpenAI-TTS-portable.zip
            artifacts/OpenAI-TTS-macos.zip
            artifacts/SHA256SUMS.txt
