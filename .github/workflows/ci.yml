name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026, macos-15]
    steps:
      - uses: actions/checkout@v6
      - name: Install Qt runtime deps (Linux only)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0 libgl1 libegl1 ffmpeg
      - name: Install ffmpeg (macOS)
        if: matrix.os == 'macos-15'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: matrix.os == 'windows-2025-vs2026'
        run: choco install ffmpeg --no-progress
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - name: Sync deps
        run: uv sync --extra dev --python 3.14
      - name: Lint
        run: uv run ruff check
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check
      - name: Tests and coverage
        env:
          PYTEST_ADDOPTS: "-q"
          QT_QPA_PLATFORM: "offscreen"
          XDG_RUNTIME_DIR: "/tmp"
        run: uv run pytest --ignore=tests/perf --cov=openai_tts_gui --cov-branch --cov-report=term-missing --cov-report=json:coverage.json
      - name: Independent coverage thresholds
        run: uv run scripts/check_coverage_thresholds.py coverage.json --min-statements 90 --min-branches 90

  build-windows:
    runs-on: windows-2025-vs2026
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - name: Sync deps
        run: uv sync --extra dev --python 3.14
      - name: PyInstaller build
        run: uv run pyinstaller --noconfirm packaging/pyinstaller/openai_tts.spec
      - name: Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenAI-TTS-windows
          path: dist/OpenAI-TTS/
